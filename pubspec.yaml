name: psivh_school_system
description: "PSI-VH Enterprise School Management System - Preah Sihanouk International School"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.4.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  pdf: ^3.10.8
  printing: ^5.13.1
  shared_preferences: ^2.2.3
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

